<style>
:root{--bg:#f0ede8;--surf:#fff;--bdr:#ddd9d2;--txt:#1a1a18;--muted:#7a7870;--red:#c0392b;--redl:#fdf0ee;--ora:#b7770d;--oral:#fef9ec;--grn:#1e7e4a;--grnl:#edf7f1;--purple:#6b3fa0;--purplel:#f0eaf8;--r:10px;--ac:#1e3a5f;--acl:#e8eef6;--ach:#152b47}
body.theme-master{--ac:#1e3a5f;--acl:#e8eef6;--ach:#152b47;--bg:#f0ede8}
body.theme-cs{--ac:#6b3fa0;--acl:#f0eaf8;--ach:#4e2d78;--bg:#f5f0f8}
body.theme-md{--ac:#b5443a;--acl:#fbeae8;--ach:#8f3129;--bg:#faf2f0}
body.theme-vendor{--ac:#1e7e4a;--acl:#edf7f1;--ach:#145c34;--bg:#ebf2ee}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;min-height:100vh}
.pg{display:none}.pg.on{display:block}
.sec{display:none}.sec.on{display:block}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-box{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.05)}
.logo{text-align:center;margin-bottom:24px}
.logo-brand{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.logo-title{font-size:21px;font-weight:700;margin-top:4px}
.logo-sub{font-size:12px;background:var(--ac);color:#fff;display:inline-block;padding:2px 12px;border-radius:20px;margin-top:8px;font-weight:500}
.tabs{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:20px}
.tab{flex:1;padding:10px;border:none;background:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.tab.on{background:var(--surf);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bdr);border-radius:var(--r);font-family:inherit;font-size:14px;background:var(--surf);color:var(--txt);outline:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
